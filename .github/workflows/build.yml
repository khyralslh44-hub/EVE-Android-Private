name: Build Rus Step Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check offline APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Reconstruct bundled lesson UI
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          cat payload/00.b64 payload/01.b64 payload/02.b64 payload/03.b64 payload/04.b64 | tr -d '\r\n ' | base64 --decode | gzip --decompress > app/src/main/assets/index.html
          test "$(wc -c < app/src/main/assets/index.html)" -gt 30000

      - name: Install local Russian speech tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg

      - name: Generate offline speech inside APK
        run: python3 tools/generate_audio.py

      - name: Validate offline lesson and audio files
        run: python3 tools/validate_assets.py

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Check APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: RusStep-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
